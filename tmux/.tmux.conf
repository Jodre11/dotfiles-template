set -g history-limit 50000
set -g mouse on
set -g status-position top
set -g status-right ' #S '

# Clipboard integration (OSC 52 — works in iTerm2 and Termius)
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux-yank #{client_tty}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "tmux-yank #{client_tty}"
bind -T root MouseDown2Pane run "pbpaste | tmux load-buffer - ; tmux paste-buffer -d"

# Slow down paste for voice input extensions
#set -g paste-time 100

# Keep sessions alive after detach (for SSH reconnect)
set -g destroy-unattached off
set -g detach-on-destroy on

# Reduce escape delay for responsiveness
set -g escape-time 0

# Forward focus events to applications (FocusIn/FocusOut)
set -g focus-events on

# Correct terminal capabilities (true colour)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -ag terminal-features ",xterm-ghostty:RGB:clipboard:usstyle:extkeys"

# Pass extended key sequences (CSI u / Kitty protocol) to applications
set -g extended-keys on

# Resize windows to largest client viewing that window (not smallest)
setw -g aggressive-resize on

# Allow escape sequences to pass through (hyperlinks, images, etc.)
set -g allow-passthrough on

# Strip Ghostty environment variables so applications inside tmux (e.g. Claude
# Code agent teams) don't misidentify the terminal as Ghostty.
set-environment -g -u GHOSTTY_BIN_DIR
set-environment -g -u GHOSTTY_RESOURCES_DIR
set-environment -g -u GHOSTTY_SHELL_FEATURES
set-environment -g -u __CFBundleIdentifier
set-environment -g TERM_PROGRAM tmux

# Propagate the per-session title out to the terminal window title, so window
# switchers (Cmd+Tab, Mission Control) and tools like claude-fleet can tell
# sessions apart instead of seeing an identical title on every window. Prefer a
# per-session `@topic` option (a short headline a Claude Code session-topic Stop
# hook can set); fall back to the pane_title `#T` when no topic is set.
set -g set-titles on
set -g set-titles-string "#{?@topic,#{@topic},#T}"
