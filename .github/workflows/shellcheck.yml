name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        run: |
          find . \( -name '*.sh' -o -name '*.sh.tmpl' -o -name '*.zsh' \) -print0 \
            | xargs -0 shellcheck --severity=warning
